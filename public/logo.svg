  <!-- COSMETICS text below -->
  <text x="100" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a1a" letter-spacing="2">COSMETICS</text>
