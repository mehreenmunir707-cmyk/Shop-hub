  <circle cx="100" cy="100" r="95" fill="none" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Inner decorative circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  
  <!-- MM Text -->
  <text x="100" y="110" font-family="'Brush Script MT', cursive, serif" font-size="60" font-weight="bold" text-anchor="middle" fill="#d4af37">MM</text>
  
  <!-- Decorative elements - left -->
  <path d="M 40 100 Q 50 90 60 95" stroke="#d4af37" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="45" cy="85" r="3" fill="#d4af37"/>
  
  <!-- Decorative elements - right -->
  <path d="M 160 100 Q 150 90 140 95" stroke="#d4af37" stroke-width="2" fill="none" stroke-linecap="round"/>
