<svg xmlns="http://www.w3.org/2000/svg" width="500" height="600" viewBox="0 0 500 600">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgMakeup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe6f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd4e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="500" height="600" fill="url(#bgMakeup)"/>
  
  <!-- Makeup Title -->
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#c41e3a">
    Makeup
  </text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="80" r="50" fill="#f7a600" opacity="0.3"/>
  <circle cx="400" cy="520" r="45" fill="#d4af37" opacity="0.25"/>
  <circle cx="250" cy="150" r="30" fill="#c41e3a" opacity="0.15"/>
</svg>
