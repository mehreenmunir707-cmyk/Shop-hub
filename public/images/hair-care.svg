<svg xmlns="http://www.w3.org/2000/svg" width="500" height="600" viewBox="0 0 500 600">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d9b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c4a0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="500" height="600" fill="url(#bgHair)"/>
  
  <!-- Hair Care Title -->
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#8b4513">
    Hair Care
  </text>
  
  <!-- Decorative elements -->
  <circle cx="90" cy="110" r="48" fill="#f7a600" opacity="0.3"/>
  <circle cx="410" cy="490" r="52" fill="#d4af37" opacity="0.2"/>
  <rect x="200" y="200" width="100" height="150" fill="#d4af37" opacity="0.1" rx="10"/>
</svg>
