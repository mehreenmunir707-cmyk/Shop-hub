<svg xmlns="http://www.w3.org/2000/svg" width="500" height="600" viewBox="0 0 500 600">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d4f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4c0e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="500" height="600" fill="url(#bgBody)"/>
  
  <!-- Body Care Title -->
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#333">
    Body Care
  </text>
  
  <!-- Decorative elements -->
  <circle cx="120" cy="120" r="45" fill="#f7a600" opacity="0.3"/>
  <circle cx="420" cy="480" r="55" fill="#d4af37" opacity="0.2"/>
</svg>
